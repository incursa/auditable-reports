name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: npm ci
      - run: python -m unittest discover -s tests -v
      - run: >-
          python skill/create-auditable-reports/scripts/check_report.py
          --artifact skill/create-auditable-reports/assets/examples/project-health/artifact.json
          --html skill/create-auditable-reports/assets/examples/project-health/report.html
